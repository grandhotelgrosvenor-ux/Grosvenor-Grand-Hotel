<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grosvenor Grand Hotel - Online Food Delivery</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f8f9fa;
            color: #333;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 20px 0;
            background: #111;
            color: #d4af37;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 28px;
            font-weight: 700;
        }
        header p {
            color: #fff;
            font-size: 14px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .menu-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .menu-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        .menu-info {
            padding: 15px;
        }
        .menu-info h4 {
            font-size: 16px;
            margin-bottom: 5px;
        }
        .menu-info .category {
            font-size: 11px;
            color: #e67e22;
            font-weight: 600;
            text-transform: uppercase;
        }
        .menu-info .price {
            font-size: 15px;
            color: #27ae60;
            font-weight: 700;
            margin: 8px 0;
        }
        .add-btn {
            width: 100%;
            padding: 10px;
            background: #111;
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .add-btn:hover {
            background: #d4af37;
            color: #000;
        }
        .cart-box {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            height: fit-content;
        }
        .cart-box h3 {
            border-bottom: 2px solid #f1f1f1;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        #cart-list {
            list-style: none;
            margin-bottom: 15px;
            max-height: 250px;
            overflow-y: auto;
        }
        #cart-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            padding: 6px 0;
            border-bottom: 1px solid #eee;
        }
        #cart-list button {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 2px 6px;
            border-radius: 3px;
            cursor: pointer;
        }
        .total-price {
            font-size: 18px;
            font-weight: 700;
            text-align: right;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 10px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 13px;
        }
        .whatsapp-btn {
            width: 100%;
            padding: 12px;
            background-color: #25d366;
            color: white;
            border: none;
            font-size: 15px;
            font-weight: 700;
            border-radius: 5px;
            cursor: pointer;
        }
        .whatsapp-btn:hover {
            background-color: #1ebd58;
        }
    </style>
</head>
<body>

    <header>
        <h1>Grosvenor Grand Hotel</h1>
        <p>Online Food Delivery Service</p>
    </header>

    <div class="container">
        <!-- Menu Grid -->
        <div id="menu-items-container" class="menu-grid"></div>

        <!-- Cart Box -->
        <div class="cart-box">
            <h3>Kayan Abinci (Cart)</h3>
            <ul id="cart-list"></ul>
            <div class="total-price">Jimilla: Rs. <span id="cart-total">0.00</span></div>

            <form id="delivery-form">
                <div class="form-group">
                    <input type="text" id="cust-name" placeholder="Suna (Name)" required>
                </div>
                <div class="form-group">
                    <input type="tel" id="cust-phone" placeholder="Lambar Waya (Phone Number)" required>
                </div>
                <div class="form-group">
                    <textarea id="cust-address" placeholder="Adireshin Isarwa (Delivery Address)" required></textarea>
                </div>
                <button type="submit" class="whatsapp-btn">Yi Odar ta WhatsApp</button>
            </form>
        </div>
    </div>

    <script>
        // Saka lambar WhatsApp din otal din ku a nan
        const HOTEL_WHATSAPP_NUMBER = "94771234567";

        const menuData = [
            { id: 1, name: "Chicken Biriyani (Keeri Samba)", category: "Biriyani", price: 1150.00, image: "images/Chicken Biriyani.jpeg" },
            { id: 2, name: "Chicken Rice & Curry", category: "Rice & Curry", price: 570.00, image: "images/Chicken Rice & Curry.jpeg" },
            { id: 3, name: "Yellow Rice & Curry", category: "Rice & Curry", price: 1500.00, image: "images/Yellow Rice & Curry.jpg" },
            { id: 4, name: "Mixed Fried Rice", category: "Fried Rice", price: 1750.00, image: "images/Mix Rice.jpeg" },
            { id: 5, name: "Prawns Fried Rice", category: "Fried Rice", price: 2100.00, image: "images/Prowns Frid Rice.jpeg" },
            { id: 6, name: "Beef Devilled (500g)", category: "Portions", price: 3150.00, image: "images/Beaf Devilled.jpeg" },
            { id: 7, name: "Cuttlefish Devilled (500g)", category: "Portions", price: 2850.00, image: "images/Cuttle Fish Devilled.jpeg" },
            { id: 8, name: "Lake Fish Devilled", category: "Portions", price: 1800.00, image: "images/Lake Fish devilled.jpeg" },
            { id: 9, name: "Pork Devilled (500g)", category: "Portions", price: 2000.00, image: "images/Pork Devilled.jpeg" },
            { id: 10, name: "Prawns Devilled (500g)", category: "Portions", price: 3150.00, image: "images/Prowns Devilled.jpeg" }
        ];

        let cart = [];

        function renderMenu() {
            const container = document.getElementById("menu-items-container");
            container.innerHTML = menuData.map(item => `
                <div class="menu-card">
                    <img src="${item.image}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/220x160?text=Grosvenor+Grand'">
                    <div class="menu-info">
                        <span class="category">${item.category}</span>
                        <h4>${item.name}</h4>
                        <div class="price">Rs. ${item.price.toFixed(2)}</div>
                    </div>
                    <button class="add-btn" onclick="addToCart(${item.id})">Ajiye a Cart</button>
                </div>
            `).join("");
        }

        function addToCart(id) {
            const item = menuData.find(i => i.id === id);
            const existing = cart.find(i => i.id === id);

            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartList = document.getElementById("cart-list");
            const totalDisplay = document.getElementById("cart-total");

            cartList.innerHTML = cart.map((item, index) => `
                <li>
                    <span>${item.name} (x${item.qty})</span>
                    <span>Rs. ${(item.price * item.qty).toFixed(2)}</span>
                    <button onclick="removeFromCart(${index})">X</button>
                </li>
            `).join("");

            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            totalDisplay.textContent = total.toFixed(2);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        document.getElementById("delivery-form").addEventListener("submit", function(e) {
            e.preventDefault();

            if (cart.length === 0) {
                alert("Don Allah ku zaɓi abinci kafin tura oda!");
                return;
            }

            const name = document.getElementById("cust-name").value;
            const phone = document.getElementById("cust-phone").value;
            const address = document.getElementById("cust-address").value;

            let message = `*--- GROSVENOR GRAND HOTEL ORDER ---*\n\n`;
            message += `*Abokin Ciniki (Customer):* ${name}\n`;
            message += `*Lambar Waya (Phone):* ${phone}\n`;
            message += `*Adireshi (Address):* ${address}\n\n`;
            message += `*Oda (Items Ordered):*\n`;

            let total = 0;
            cart.forEach(item => {
                let sub = item.price * item.qty;
                total += sub;
                message += `• ${item.name} x ${item.qty} - Rs. ${sub.toFixed(2)}\n`;
            });

            message += `\n*Jimilla (Total Amount):* Rs. ${total.toFixed(2)}`;

            const url = `https://wa.me/${HOTEL_WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        });

        document.addEventListener("DOMContentLoaded", renderMenu);
    </script>
</body>
</html>
